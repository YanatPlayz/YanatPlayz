name: zipf

on:
  schedule:
    - cron: "17 9 * * *"   # every morning, ~09:17 UTC
  workflow_dispatch:        # or whenever you press the button

permissions:
  contents: write

concurrency:
  group: zipf
  cancel-in-progress: false

jobs:
  plot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rank the words
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZIPF_TOKEN: ${{ secrets.ZIPF_TOKEN }}   # PAT — omit to stay public-only
          GH_USER: ${{ github.repository_owner }}
          ZIPF_EXCLUDE: ""                        # e.g. "work-*,client/*"
          ZIPF_LABEL_MIN: "4"                     # min uses before a word is named
        run: python zipf.py    # change to scripts/zipf.py if you move it

      - name: Commit if the plot moved
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "plot unchanged, nothing to commit"
          else
            git commit -m "zipf: $(date -u +%Y-%m-%d)"
            git push
          fi
