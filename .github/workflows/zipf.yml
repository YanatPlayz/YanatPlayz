name: zipf

on:
  schedule:
    - cron: "17 9 * * *"   # every morning, ~09:17 UTC
  workflow_dispatch:        # or whenever you press the button

permissions:
  contents: write

concurrency:
  group: zipf
  cancel-in-progress: false

jobs:
  plot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rank the words
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python zipf.py

      - name: Commit if the plot moved
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add zipf.svg data/counts.json
          git diff --quiet --cached || git commit -m "zipf: $(date -u +%Y-%m-%d)"
          git push
